kind = "web"
previewPath = "/"
title = "POS360"
version = "1.0.0"
id = "artifacts/pos360"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18338

[services.development]
run = "pnpm --filter @workspace/pos360 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pos360", "run", "build" ]
serve = "static"
publicDir = "artifacts/pos360/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18338"
BASE_PATH = "/"
